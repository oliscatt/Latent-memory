name: 发布检查

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行全部公开自检
        run: >-
          python tests/run_release_checks.py
          --json-out "release-checks-${{ matrix.python-version }}.json"
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checks-${{ matrix.python-version }}
          path: release-checks-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 14
