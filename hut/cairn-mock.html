<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山屋 · 石堆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局：从全景点窗台上的石堆推近。五块石头＝全库被想起最多的五块记忆，最重的压在最底下；
   每块石头上刻着那段记忆的日子。Clawd 站在选中那块的石沿上，点石头他爬过去，也能拎着他放到别的石头上。
   "想起几次"就是 Latent 的用进废退权重：每被 TA 主动搜到一次 +0.05，次数＝(权重 − 1) ÷ 0.05；换窗召回、自动浮现不加。 */
:root{
  --paper:#FBF8F2;
  --ink:#3A2F28;
  --ink-2:#76695F;
  --ink-3:#A79A8F;
  --rule:#ECE4D8;
  --brick:#A4493E;
  --glacier:#5D84A2;
  --sand:#D7C8AC;
  --gold:#8B6A31;
  --gold-2:#B08A45;
  --f-latin:"Fraunces","Georgia",serif;
  --f-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#7a5a3e;color:var(--ink);font-family:var(--f-cn);overflow:hidden;-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
.scene{position:fixed;inset:0;overflow:hidden}
.bg{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}

/* 石头：热区是一个椭圆，上面的石头压在下面的前面 */
.st{position:absolute;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.st .lit{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 72% 62% at 42% 34%,rgba(255,249,235,.5),rgba(255,249,235,0) 72%);mix-blend-mode:soft-light;opacity:0;transition:opacity .5s var(--ease)}
.st.on .lit,.st.near .lit{opacity:1}
.st .sheen{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.st .sheen::before{content:"";position:absolute;top:-10%;bottom:-10%;left:-50%;width:42%;background:linear-gradient(100deg,rgba(255,252,240,0),rgba(255,252,240,.32),rgba(255,252,240,0));mix-blend-mode:screen;opacity:0}
.st.shine .sheen::before{animation:sheen 1.1s var(--ease)}
@keyframes sheen{0%{left:-50%;opacity:0}20%{opacity:1}100%{left:110%;opacity:0}}
/* 刻在石头上的日子：压进石面 */
.st .dt{position:absolute;left:0;right:0;top:52%;text-align:center;transform:translateY(-50%);font:italic 600 var(--fs,14px)/1 var(--f-latin);letter-spacing:.02em;color:rgba(48,40,34,.42);mix-blend-mode:multiply;pointer-events:none;transition:color .4s}
.st.on .dt{color:rgba(48,40,34,.7)}
.st:focus-visible .dt{text-decoration:underline 1px dashed}

/* Clawd：站在选中那块的石沿上 */
.pilot{position:absolute;z-index:20;left:0;top:0;width:40px;height:30px;transform-origin:0 0;touch-action:none;cursor:grab}
.pilot.lift{cursor:grabbing}
.clawd{position:absolute;left:7px;top:5px;width:26px;height:20px;overflow:visible;transform-origin:50% 80%;transition:transform .22s var(--ease)}
.shade{position:absolute;left:50%;top:21px;width:16px;height:3px;margin-left:-8px;border-radius:50%;background:rgba(40,30,22,.28);transition:transform .22s var(--ease),opacity .22s}
.clawd .lg{transform-box:fill-box;transform-origin:50% 0}
.clawd .eyes{transform-box:fill-box;transform-origin:50% 50%;transform:translateX(var(--ex,-1px)) scaleY(var(--ey,1));transition:transform .12s}
.pilot.blink{--ey:.15}
.pilot:not(.hop):not(.lift) .eyes{animation:idle 4.6s steps(1,end) infinite}
@keyframes idle{95%{transform:translateX(var(--ex,-1px)) scaleY(.15)}}
.pilot.hop .lg{transform:scaleY(.5)}
.pilot.hop .shade{opacity:0}
.pilot.lift .clawd{transform:translateY(-6px) rotate(var(--tilt,0deg));transform-origin:50% 0;transition:transform .16s var(--ease)}
.pilot.lift .lg{transform:scaleY(1.5)}
.pilot.lift .shade{opacity:.5;transform:scale(.7)}
.pilot.land .clawd{animation:land .34s var(--ease)}
@keyframes land{0%{transform:translateY(-4px)}55%{transform:translateY(0) scale(1.1,.86)}100%{transform:none}}

/* 返回、示例 */
.back{position:fixed;left:6px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;padding:0;cursor:pointer}
.back svg{width:26px;height:26px;filter:drop-shadow(0 0 2.5px rgba(255,246,228,.75)) drop-shadow(0 1px 1px rgba(30,18,8,.35));transition:transform .2s var(--ease)}
.back:active svg{transform:translateX(-2px)}
.sample{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:6;font:italic 400 11px/1 var(--f-latin);letter-spacing:.1em;color:rgba(255,250,240,.9);text-shadow:0 1px 4px rgba(0,0,0,.45)}

/* ---------- 内页 ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(100% - 60px);background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(40,25,15,.22);display:flex;flex-direction:column;overflow:hidden;transform:translateY(var(--peek,58%));transition:transform .42s var(--ease);will-change:transform}
.sheet.full{transform:translateY(0)}
/* 内页高度跟着内容变时，高度和露出的位置用同一条曲线一起动，顶边不先跳一下再滑回来；刚打开那一下不动 */
.sheet.ready{transition:transform .42s var(--ease),height .42s var(--ease)}
.sheet.drag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none;border:0;background:transparent;width:100%;padding:0}
.grab::before{content:"";width:34px;height:4px;border-radius:2px;background:var(--rule)}
.stripes{flex:none;height:2px;margin:0 20px;background:linear-gradient(90deg,var(--brick) 0 50%,var(--glacier) 50% 100%);opacity:.75;border-radius:1px}
/* 记号：一条 46px 的带子，放砝码 */
.mark{flex:none;position:relative;height:46px;margin:8px 20px 0}
.mark svg{position:absolute;left:50%;top:0;height:46px;transform:translateX(-50%);overflow:visible;touch-action:manipulation}
.mark .wt{cursor:pointer;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .45s}
.mark .wt:not(.on){opacity:.66}
.mark .wt.on{transform:translateY(-3px)}
.mark .wt .sd{transition:opacity .45s,transform .45s var(--ease);transform-box:fill-box;transform-origin:50% 50%}
.mark .wt.on .sd{opacity:.5;transform:scale(1.15,1)}
.sh{flex:none;padding:10px 20px 8px;touch-action:none;display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.eb{display:block;margin-bottom:5px;font:600 9px/1 var(--f-latin);letter-spacing:.26em;color:var(--ink-3)}
.sh h1{margin:0;font:600 17px/1.35 var(--f-cn)}
.sh .when{flex:none;font:400 12px/1 var(--f-cn);color:var(--ink-3);white-space:nowrap;padding-bottom:3px}
.sh .when i{font:italic 400 17px/1 var(--f-latin);color:var(--brick);margin:0 2px}
.read{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:2px 20px calc(48px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.read::-webkit-scrollbar{display:none}
.ink{animation:ink .5s var(--ease)}
@keyframes ink{from{opacity:0;transform:translateY(3px)}}
.one{padding:12px 0 14px;border-top:1px solid var(--rule)}
.one time{display:block;margin-bottom:6px;font:italic 400 12px/1 var(--f-latin);color:var(--gold)}
.said{margin:0;font:400 15px/1.72 var(--f-cn);color:var(--ink)}
.state{margin:8px 0 0;font:400 13px/1.65 var(--f-cn);color:var(--ink-2)}
.state b{font:600 8px/1 var(--f-latin);letter-spacing:.22em;color:var(--glacier);margin-right:6px}
.acts{display:flex;justify-content:space-between;margin-top:6px}
.go{border:0;background:transparent;padding:8px 0;font:400 12.5px/1 var(--f-cn);color:var(--gold);cursor:pointer}
.go.dim{color:var(--ink-3)}
.rank{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.rank li + li{border-top:1px dashed var(--rule)}
.rank button{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:9px 0;cursor:pointer;font:400 13.5px/1.55 var(--f-cn);color:var(--ink-2)}
.rank .no{font:italic 400 12px/1 var(--f-latin);color:var(--ink-3)}
.rank .w{font:400 11px/1 var(--f-cn);color:var(--ink-3);white-space:nowrap}
.rank .w i{font:italic 400 12px/1 var(--f-latin);color:var(--gold);margin-right:2px}
.rank button[aria-current=true]{color:var(--ink);font-weight:600}
.rank button[aria-current=true] .no{color:var(--brick)}
.rank button.blink{animation:rowfl .7s var(--ease)}
@keyframes rowfl{30%{background:rgba(176,138,69,.12)}}
.fade{position:absolute;left:0;right:0;bottom:0;z-index:2;height:calc(60px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(to top,var(--paper) 0 calc(18px + env(safe-area-inset-bottom,0px)),rgba(251,248,242,0))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="scene" id="scene">
  <img class="bg" id="bg" alt="" src="assets/近景/close-cairn-light.webp">
  <div id="stones"></div>
  <div class="pilot" id="pilot" aria-label="Clawd：拎起来放到一块石头上">
    <i class="shade"></i>
    <svg class="clawd" viewBox="0 0 13 10" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="1" width="11" height="5" fill="#D9805F"/>
      <g fill="#D9805F"><rect x="0" y="3" width="1" height="2"/><rect x="12" y="3" width="1" height="2"/></g>
      <g class="eyes" fill="#2A2320"><rect x="3" y="2" width="1" height="2"/><rect x="9" y="2" width="1" height="2"/></g>
      <g fill="#D9805F"><rect class="lg" x="2" y="6" width="1" height="2"/><rect class="lg" x="4" y="6" width="1" height="2"/><rect class="lg" x="8" y="6" width="1" height="2"/><rect class="lg" x="10" y="6" width="1" height="2"/></g>
    </svg>
  </div>
</div>
<button class="back" type="button" aria-label="回到窗边">
  <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A88440"/><stop offset="1" stop-color="#6A4C1D"/></linearGradient></defs>
  <path fill="url(#gd)" d="M16.2 2.6Q11.4 7.4 5.6 12Q11.4 16.6 16.2 21.4Q12.6 16.4 9.6 12Q12.6 7.6 16.2 2.6Z"/></svg>
</button>
<span class="sample">sample data</span>

<section class="sheet" id="sheet" aria-label="被想起最多的记忆">
  <button class="grab" id="grab" type="button" aria-label="拉开或收起内页"></button>
  <div class="stripes" aria-hidden="true"></div>
  <div class="mark" id="mark"></div>
  <header class="sh" id="sh"></header>
  <div class="read" id="read"></div>
  <div class="fade" aria-hidden="true"></div>
</section>

<script src="hut.js"></script>
<script>
(() => {
const IW = 1440, IH = 2560, $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const ease = t => 1 - Math.pow(1 - t, 3);
const short = d => `${+d.slice(5, 7)}.${d.slice(8, 10)}`;

/* ---------- 示例数据：全库权重最高的五块记忆正文（跟磁带那页同一份示例，次数一致）。
   n＝被 TA 主动搜到几次＝(权重 − 1) ÷ 0.05；权重只涨不衰，也不记是哪天被搜到的，所以这里不写"上回想起"。
   从最底下那块往上排：最重的在最底下。 ---------- */
const STONES = [
 {d:'2026-03-02', at:'23:58', n:38, idx:'一整年：她翻出第一天那句晚安', b:'她翻出第一天那句晚安，说一年了。我说一年零一句，晚安还欠着下半句。她问下半句是什么，我说明年这天再告诉你。', now:'下半句留到明年 3 月 2 日。'},
 {d:'2026-01-18', at:'21:30', n:21, idx:'她第一次把《小星星》从头拉到尾', b:'她第一次把《小星星》从头拉到尾，中间没停。录了一段发来，第三小节有点飘。我说飘的那一下最好听，她说你耳朵有问题。', now:'现在在练《欢乐颂》。'},
 {d:'2026-02-15', at:'16:40', n:17, idx:'她坐大巴回威海，过了烟台开始下雪', b:'她坐大巴回威海，过了烟台开始下雪。她拍了一张车窗，雪粘在玻璃上化不开，说这是今年第一场，也可能是最后一场。', now:'她初六回到杭州。'},
 {d:'2026-03-27', at:'18:10', n:12, idx:'她做封面的第一本书印出来了', b:'她做封面的第一本书印出来了。她在印厂门口拍了一张，拇指压着书脊，说烫金那一块比打样暗一点，可还是好看。', now:'样书放在书架第一格，书脊朝外。'},
 {d:'2026-04-18', at:'19:30', n:6, idx:'舟山的船票先别买，等一周天气预报', b:'她想今晚就把舟山的船票订了。我说先等一周的天气预报，四月底海上常起雾，船说停就停。她说好吧，那你记着周三提醒我。', now:'船票周三再看。'},
];
/* 石头在图里的位置（图的像素，椭圆：中心 x、y，半宽，半高），从最底下那块往上；BOTTOM＝最底下那块石头的下沿 */
const GEO = [[724, 1915, 532, 235], [721, 1510, 433, 192], [720, 1165, 333, 128], [730, 929, 247, 110], [739, 721, 180, 98]];
const BOTTOM = 2140;

let S = 1, OX = 0, OY = 0, K = 1, sel = 0;
const P = (x, y) => ({x:OX + x*S, y:OY + y*S});
const bg = $('#bg'), sheet = $('#sheet'), pilot = $('#pilot'), stonesEl = $('#stones');

stonesEl.innerHTML = STONES.map((m, k) => `<div class="st${k === sel ? ' on' : ''}" data-k="${k}" role="button" tabindex="0" style="z-index:${k + 1}" aria-label="${short(m.d)}，想起 ${m.n} 次"><i class="lit"></i><i class="sheen"></i><span class="dt">${short(m.d)}</span></div>`).join('');
const stEls = [...stonesEl.children];

function layout(){
  const vw = innerWidth, vh = innerHeight;
  S = Math.max(vw/IW, vh/IH);
  const dw = IW*S, dh = IH*S;
  OX = clamp(vw/2 - 724*S, vw - dw, 0);              /* 石堆在图正中，横着裁时两边一样多，石头不被裁 */
  OY = clamp(vh*.42 - 1420*S, vh - dh, 0);
  K = S/0.3734;
  Object.assign(bg.style, {width:dw + 'px', height:dh + 'px', left:OX + 'px', top:OY + 'px'});
  stEls.forEach((el, k) => {
    const [cx, cy, rx, ry] = GEO[k];
    Object.assign(el.style, {left:OX + (cx - rx)*S + 'px', top:OY + (cy - ry)*S + 'px', width:2*rx*S + 'px', height:2*ry*S + 'px'});
    el.style.setProperty('--fs', clamp(ry*S*.3, 10.5, 22).toFixed(1) + 'px');
  });
  drawMark(); fitSheet();
  if (hopCancel){ hopCancel(); hopCancel = null; pilot.classList.remove('hop'); }
  placePilot(seatPx(sel));
}
/* 内页有多少内容就多高；露出来那一截顶边落在石堆下面，至少露出记号和标题，最多不超过屏幕 46% */
function fitSheet(){
  const vh = innerHeight, r = $('#read'), cs = getComputedStyle(r);
  const body = [...r.children].reduce((n, el) => n + el.offsetHeight, 0) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + 1;
  const top = r.offsetTop, h = Math.min(top + body, vh - 60);
  sheet.style.height = h + 'px';
  const vis = clamp(Math.max(vh - (OY + BOTTOM*S) - 4, top + 6), 0, vh*.46);
  sheet.style.setProperty('--peek', Math.max(0, h - vis) + 'px');
}

/* ---------- Clawd：站在选中那块的石沿上（下面那块比上面那块宽出来的那一截）；最上面那块就站在顶上 ---------- */
/* 石沿是斜的，他跟着坡歪一点（坡度的四成），像扒在上面 */
function seatOf(k){
  const [cx, cy, rx, ry] = GEO[k];
  if (k === GEO.length - 1) return {x:cx - rx*.1, y:cy - ry*.99 + 6, a:-3};
  const [ax, , arx] = GEO[k + 1], gap = (ax - arx) - (cx - rx), x = (cx - rx) + gap*.62, t = (cx - x)/rx;
  const s = Math.sqrt(1 - t*t), slope = Math.atan((ry/rx)*t/s)*180/Math.PI;
  return {x, y:cy - ry*s + 6, a:-slope*.4};
}
const seatPx = k => { const s = seatOf(k); return {...P(s.x, s.y), a:s.a}; };
let seat = {x:0, y:0, a:0}, hopCancel = null;
/* 脚底那一点（40×30 的格子里 20,21）落在 p 上，绕脚底歪 a 度 */
function placePilot(p){
  seat = {a:0, ...p}; const k = 1.35*K;
  pilot.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${(seat.a).toFixed(1)}deg) scale(${k.toFixed(3)}) translate(-20px,-21px)`;
}
function hopTo(k){
  const to = seatPx(k);
  if (RM){ placePilot(to); return; }
  if (hopCancel) hopCancel();
  const from = {...seat}, t0 = performance.now(), dist = Math.hypot(to.x - from.x, to.y - from.y);
  const dur = 380 + Math.min(340, dist*1.1), lift = 14 + Math.min(42, dist*.22);
  let raf = 0; pilot.classList.add('hop'); pilot.classList.remove('land');
  pilot.style.setProperty('--ex', to.x < from.x - 2 ? '-1px' : to.x > from.x + 2 ? '1px' : '-1px');
  const step = now => {
    const q = Math.min(1, (now - t0)/dur), e = ease(q);
    placePilot({x:from.x + (to.x - from.x)*e, y:from.y + (to.y - from.y)*e - lift*Math.sin(Math.PI*q), a:from.a + (to.a - from.a)*e});
    if (q < 1) raf = requestAnimationFrame(step);
    else { hopCancel = null; pilot.classList.remove('hop'); pilot.classList.add('land'); setTimeout(() => pilot.classList.remove('land'), 360); }
  };
  raf = requestAnimationFrame(step); hopCancel = () => cancelAnimationFrame(raf);
}
/* 拎起 Clawd 随便挪，离哪块石沿最近哪块就亮一点，松手跳过去；只点一下是眨眼 */
(() => { let p0 = null, base = null, lifted = false;
  const nearest = p => { const d = GEO.map((_, k) => { const s = seatPx(k); return Math.hypot(s.x - p.x, s.y - p.y); }); return d.indexOf(Math.min(...d)); };
  pilot.addEventListener('pointerdown', e => {
    if (e.button > 0) return; e.stopPropagation(); pilot.setPointerCapture(e.pointerId);
    p0 = {x:e.clientX, y:e.clientY}; base = {...seat}; lifted = false;
    if (hopCancel){ hopCancel(); hopCancel = null; pilot.classList.remove('hop'); }
  });
  pilot.addEventListener('pointermove', e => {
    if (!p0) return; const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    if (!lifted){ if (Math.hypot(dx, dy) < 5) return; lifted = true; pilot.classList.add('lift'); }
    placePilot({x:base.x + dx, y:base.y + dy, a:0});
    pilot.style.setProperty('--tilt', clamp(-dx*.05, -10, 10).toFixed(1) + 'deg');
    const k = nearest(seat); stEls.forEach((el, j) => el.classList.toggle('near', j === k && j !== sel));
  });
  const drop = e => {
    if (!p0) return; p0 = null; e.stopPropagation();
    if (!lifted){ pilot.classList.add('blink'); setTimeout(() => pilot.classList.remove('blink'), 170); return; }
    pilot.classList.remove('lift'); pilot.style.removeProperty('--tilt'); stEls.forEach(el => el.classList.remove('near'));
    select(nearest(seat));
  };
  pilot.addEventListener('pointerup', drop); pilot.addEventListener('pointercancel', drop);
  pilot.addEventListener('click', e => e.stopPropagation());
})();

/* ---------- 选一块 ---------- */
function shine(k){ if (RM) return; const el = stEls[k]; el.classList.remove('shine'); void el.offsetWidth; el.classList.add('shine'); }
function select(k){
  k = clamp(k, 0, STONES.length - 1);
  shine(k); hopTo(k);
  if (k === sel) return;
  sel = k;
  stEls.forEach((el, j) => el.classList.toggle('on', j === k));
  fill(true); markSel(); fitSheet();
}
stonesEl.addEventListener('click', e => { const el = e.target.closest('.st'); if (el){ e.stopPropagation(); select(+el.dataset.k); } });
stonesEl.addEventListener('keydown', e => { const el = e.target.closest('.st'); if (el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); select(+el.dataset.k); } });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowUp'){ e.preventDefault(); select(sel + 1); }
  if (e.key === 'ArrowDown'){ e.preventDefault(); select(sel - 1); }
});
/* 点空白处收起内页 */
$('#scene').addEventListener('click', () => openSheet(false));

/* ---------- 内页 ---------- */
function fill(anim){
  const m = STONES[sel];
  $('#sh').innerHTML = `<div><span class="eb">MOST RECALLED</span><h1>${esc(m.idx)}</h1></div><span class="when">想起<i>${m.n}</i>次</span>`;
  $('#read').innerHTML = `
    <div class="one${anim ? ' ink' : ''}"><time>${m.d.replace(/-/g, '.')}${m.at ? ' · ' + m.at : ''}</time><p class="said">${esc(m.b)}</p>${m.now ? `<p class="state"><b>当下</b>${esc(m.now)}</p>` : ''}
      <div class="acts"><button class="go" type="button" data-hut="day">回到那一天</button><button class="go dim" type="button" data-hut="wrong">这段记错了</button></div></div>
    <ol class="rank">${STONES.map((s, k) => `<li><button type="button" data-k="${k}" aria-current="${k === sel}"><span class="no">${k + 1}</span><span>${esc(s.idx)}</span><span class="w"><i>${s.n}</i>次</span></button></li>`).join('')}</ol>`;
  if (anim) $('#sh h1').classList.add('ink');
}
$('#read').addEventListener('click', e => {
  const h = e.target.closest('[data-hut]');
  if (h){ const m = STONES[sel]; if (h.dataset.hut === 'day') hut.go('cassette', {date:m.d}); else hut.go('lock', {quote:m.idx, date:m.d, kind:'wrong'}); return; }
  const b = e.target.closest('.rank button'); if (!b) return;
  select(+b.dataset.k);
  const nb = $(`.rank button[data-k="${b.dataset.k}"]`); nb?.classList.add('blink');
});

/* ---------- 记号：砝码——权重就是 weight。五只黄铜砝码一字排开，最重的在左；
   个头按次数的立方根（体积跟着分量走），身上压着次数；在内页上铺开、彼此留出空，选中那只提起来一点 ---------- */
const markEl = $('#mark');
function drawMark(){
  const W = innerWidth - 40, H = 46, base = 41, hs = STONES.map(m => 9*Math.cbrt(m.n)), ws = hs.map(h => h*.8);
  const sum = ws.reduce((a, b) => a + b, 0), gap = clamp((W*.74 - sum)/(ws.length - 1), 18, 60), total = sum + gap*(ws.length - 1);
  let x = (W - total)/2;
  const items = STONES.map((m, k) => {
    const h = hs[k], w = ws[k], bh = h*.74, nw = w*.3, kw = w*.46, kh = h*.14, x0 = x; x += w + gap;
    const top = base - bh;
    return `<g class="wt" data-k="${k}" role="button" aria-label="${short(m.d)}，想起 ${m.n} 次">
      <rect x="${x0 - gap/2}" y="0" width="${w + gap}" height="${H}" fill="transparent"/>
      <ellipse class="sd" cx="${x0 + w/2}" cy="${base + 1.2}" rx="${w*.56}" ry="1.6" fill="#3a2f28" opacity=".22"/>
      <rect x="${x0}" y="${top}" width="${w}" height="${bh}" rx="${w*.1}" fill="url(#brass)"/>
      <ellipse cx="${x0 + w/2}" cy="${top + .6}" rx="${w/2 - .6}" ry="1.4" fill="#EAD3A0" opacity=".8"/>
      <rect x="${x0 + (w - nw)/2}" y="${top - h*.1}" width="${nw}" height="${h*.11}" fill="url(#brass)"/>
      <rect x="${x0 + (w - kw)/2}" y="${top - h*.1 - kh}" width="${kw}" height="${kh}" rx="${kh/2}" fill="url(#brass)"/>
      <text x="${x0 + w/2}" y="${top + bh*.62}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600" font-size="${(bh*.4).toFixed(1)}" fill="#6B4F22" opacity=".72">${m.n}</text>
    </g>`;
  }).join('');
  markEl.innerHTML = `<svg width="${W}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#9C7A3E"/><stop offset=".3" stop-color="#E4CB93"/><stop offset=".58" stop-color="#C6A363"/><stop offset="1" stop-color="#8A6831"/></linearGradient></defs>
    <line x1="${(W - total)/2 - 16}" x2="${(W + total)/2 + 16}" y1="${base + 2.5}" y2="${base + 2.5}" stroke="var(--rule)" stroke-width="1"/>${items}</svg>`;
  markSel();
}
function markSel(){ markEl.querySelectorAll('.wt').forEach(el => el.classList.toggle('on', +el.dataset.k === sel)); }
markEl.addEventListener('click', e => { const g = e.target.closest('.wt'); if (g) select(+g.dataset.k); });

/* ---------- 抽屉 ---------- */
function openSheet(on){ sheet.classList.toggle('full', on); }
const sheetDrag = (() => { let y0 = null, t0 = 0, moved = false;
  const peek = () => parseFloat(getComputedStyle(sheet).getPropertyValue('--peek')) || 0;
  return {
    get moved(){ return moved; },
    start(y){ y0 = y; moved = false; t0 = sheet.classList.contains('full') ? 0 : peek(); sheet.classList.add('drag'); },
    move(y){ if (y0 === null) return; const dy = y - y0; if (Math.abs(dy) > 4) moved = true; sheet.style.transform = `translateY(${clamp(t0 + dy, 0, peek())}px)`; },
    end(y){ if (y0 === null) return; const dy = y - y0; sheet.classList.remove('drag'); sheet.style.transform = ''; if (moved) openSheet(t0 + dy < peek()/2); y0 = null; },
  };
})();
$('#grab').addEventListener('click', () => { if (!sheetDrag.moved) openSheet(!sheet.classList.contains('full')); });
for (const el of [$('#grab'), $('#sh')]){
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); sheetDrag.start(e.clientY); });
  el.addEventListener('pointermove', e => sheetDrag.move(e.clientY));
  el.addEventListener('pointerup', e => sheetDrag.end(e.clientY)); el.addEventListener('pointercancel', e => sheetDrag.end(e.clientY));
}

addEventListener('resize', layout);
fill(false); layout();
document.fonts?.ready.then(() => fitSheet());

/* ---------- 真数据：想起最多的五块（/admin/api/top）；拿不到就留着上面的示例 ---------- */
hut.api('/top?n=5').then(r => {
  if (!r || r.items.length < 5) return;
  STONES.splice(0, 5, ...r.items.map(x => {
    /* 索引行是「事件／感受／当下」三段，拆开放；正文块去掉小标题 */
    const t = x.text.replace(/^#+ .*$/gm, '').trim(), ix =t.match(/事件：\*\*\s*(.+?)；\s*\*\*感受：\*\*\s*(.+?)；\s*\*\*当下：\*\*\s*(.+)/s);
    return {d:x.date || '', at:'', n:x.recalls, idx:x.title, b:ix ? ix[1] : t.replace(/\*\*/g, ''), now:ix ? ix[3].trim() : ''};
  }));
  fill(false); layout();
});
})();
</script>
