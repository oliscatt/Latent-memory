<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山屋 · 磁带</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局：桌上的磁带铺满全屏；底部一张磁带内页做成可上拉的抽屉——上面一条日子的轴，下面这一天的索引和正文 */
:root{
  --paper:#FBF8F2;
  --ink:#3A2F28;
  --ink-2:#76695F;
  --ink-3:#A79A8F;
  --rule:#ECE4D8;
  --brick:#A4493E;     /* 南青冈红 */
  --glacier:#5D84A2;   /* 冰川灰蓝 */
  --sand:#D7C8AC;      /* 草原沙 */
  --gold:#8B6A31;      /* 暗金 */
  --gold-2:#B08A45;
  --f-latin:"Fraunces","Georgia",serif;
  --f-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:#5b3b27;color:var(--ink);font-family:var(--f-cn);overflow:hidden;-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden}
.bg{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.ov{position:absolute;pointer-events:none}

/* 印在标签上的字 */
.tapelabel{transform-origin:0 50%;display:flex;align-items:baseline;gap:7px;white-space:nowrap;color:#4a382b;mix-blend-mode:multiply;opacity:.88}
.tapelabel .side{font:600 8px/1 var(--f-latin);letter-spacing:.28em;color:var(--brick)}
.tapelabel .yr{font:italic 400 15px/1 var(--f-latin);font-variant-numeric:oldstyle-nums}
.tapelabel .mo{font:600 13px/1 var(--f-cn);letter-spacing:.12em}

/* 随身听小窗 */
.lcd{transform-origin:50% 50%;color:rgba(240,234,222,.82);text-align:center;font:italic 400 10px/1.3 var(--f-latin);letter-spacing:.08em;text-shadow:0 0 6px rgba(240,234,222,.2)}
.lcd b{display:block;font:500 19px/1.15 var(--f-latin);letter-spacing:.04em;font-variant-numeric:lining-nums}

/* 返回：只有一枚暗金色的尖角箭头，背后是看不见的点击区 */
.back{position:fixed;left:6px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;padding:0;cursor:pointer}
.back svg{width:26px;height:26px;filter:drop-shadow(0 0 2.5px rgba(255,246,228,.75)) drop-shadow(0 1px 1px rgba(30,18,8,.35));transition:transform .2s var(--ease)}
.back:active svg{transform:translateX(-2px)}
.back:focus-visible{outline:1.5px solid var(--gold-2);outline-offset:-6px;border-radius:50%}
.sample{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:6;font:italic 400 11px/1 var(--f-latin);letter-spacing:.1em;color:rgba(255,250,240,.8);text-shadow:0 1px 4px rgba(0,0,0,.35)}

/* 内页抽屉 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(100% - 60px - env(safe-area-inset-top,0px));background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(40,25,15,.22);display:flex;flex-direction:column;overflow:hidden;transform:translateY(var(--peek,52%));transition:transform .42s var(--ease);will-change:transform}
.sheet.full{transform:translateY(0)}
/* 内页高度跟着内容变时，高度和露出的位置用同一条曲线一起动，顶边不先跳一下再滑回来；刚打开那一下不动 */
.sheet.ready{transition:transform .42s var(--ease),height .42s var(--ease)}
.sheet.drag{transition:none}
.sheet > *{position:relative;z-index:1}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none;border:0;background:transparent;width:100%;padding:0}
.grab::before{content:"";width:34px;height:4px;border-radius:2px;background:var(--rule)}
.grab:focus-visible{outline:2px solid var(--glacier);outline-offset:-4px}
.stripes{flex:none;height:2px;margin:0 20px;background:linear-gradient(90deg,var(--brick) 0 50%,var(--glacier) 50% 100%);opacity:.75;border-radius:1px}
.sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px 0;touch-action:none}
.eb{display:block;margin-bottom:3px;font:600 9px/1 var(--f-latin);letter-spacing:.26em;color:var(--ink-3)}
.when{display:flex;align-items:baseline;gap:6px;background:transparent;border:0;padding:4px 0;cursor:pointer;color:var(--ink);font:600 17px/1.2 var(--f-cn)}
.when i{font:italic 400 17px/1 var(--f-latin);color:var(--brick);font-variant-numeric:oldstyle-nums}
.when svg{width:10px;height:10px;color:var(--gold);align-self:center;transition:transform .3s var(--ease)}
.when[aria-expanded=true] svg{transform:rotate(180deg)}
.when:focus-visible{outline:2px solid var(--glacier);outline-offset:2px;border-radius:4px}
/* 快进：看不见的点击区 */
.ffbtn{display:flex;align-items:center;gap:5px;height:40px;padding:0 2px 0 10px;border:0;background:transparent;font:400 13px/1 var(--f-cn);color:var(--gold);cursor:pointer}
.ffbtn svg{width:12px;height:12px;transition:transform .35s var(--ease)}
.ffbtn[aria-expanded=true] svg{transform:translateX(3px)}
.ffbtn:focus-visible{outline:2px solid var(--glacier);outline-offset:2px;border-radius:6px}
/* 快进输入：从按钮那里展开，不凭空出现 */
.ffwrap{flex:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--ease)}
.ffwrap.open{grid-template-rows:1fr}
.ffwrap > div{overflow:hidden;min-height:0}
.ff{margin:6px 20px 2px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:18px;background:#fff;border:1px solid var(--rule);opacity:0;transform:translateY(-6px) scaleX(.96);transform-origin:100% 50%;transition:opacity .3s var(--ease),transform .36s var(--ease),border-color .2s}
.ffwrap.open .ff{opacity:1;transform:none}
.ff:focus-within{border-color:var(--gold-2)}
.ff svg{width:12px;height:12px;flex:none;color:var(--gold)}
.ff input{flex:1;min-width:0;border:0;background:transparent;font:400 14px/1 var(--f-cn);color:var(--ink);outline:none}
.ff input::placeholder{color:var(--ink-3)}
.ffmsg{font:italic 400 11px/1 var(--f-latin);color:var(--ink-3);white-space:nowrap}

/* 年月弹层：小小一块，只露上下各一个，中间选中的最大 */
.picker{position:fixed;z-index:9;width:132px;padding:5px 6px;background:#fff;border-radius:12px;box-shadow:0 10px 26px rgba(40,25,15,.2),0 1px 2px rgba(40,25,15,.06);display:grid;grid-template-columns:1fr 1fr;opacity:0;transform:translateY(6px) scale(.96);transform-origin:20px 100%;pointer-events:none;transition:opacity .22s var(--ease),transform .28s var(--ease)}
.picker.down{transform:translateY(-6px) scale(.96);transform-origin:20px 0}
.picker.on{opacity:1;transform:none;pointer-events:auto}
.picker::before,.picker::after{content:"";position:absolute;left:10px;right:10px;height:1px;background:var(--gold-2);opacity:.4;pointer-events:none}
.picker::before{top:31px}
.picker::after{top:57px}
.wheel{position:relative;height:78px;overflow:hidden;touch-action:none;cursor:grab;outline:none;user-select:none;-webkit-user-select:none}
.wheel:focus-visible{box-shadow:inset 0 0 0 1.5px var(--glacier);border-radius:8px}
.rail{position:absolute;left:0;right:0;top:26px;will-change:transform}
.rail button{display:block;width:100%;height:26px;border:0;padding:0;background:transparent;color:var(--ink-3);font:400 13px/26px var(--f-cn);text-align:center;cursor:pointer;transform-origin:50% 50%}
.wheel.yr .rail button{font:italic 400 14px/26px var(--f-latin);font-variant-numeric:oldstyle-nums}
.rail button.on{color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;z-index:8;display:none}
.scrim.on{display:block}

/* 日子小路：虚线串起每一天，有窗口的点红蓝交替；整条左右拖，Clawd 站在中间，脚下那天就是选中的 */
.axis{position:relative;flex:none;height:50px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.axis.grabbing{cursor:grabbing}
.axis:focus-visible .lane{box-shadow:inset 0 -1.5px 0 var(--glacier)}
.lane{position:absolute;inset:0;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{position:absolute;left:0;top:0;height:100%;will-change:transform}
.trail{position:absolute;top:24px;left:0;height:1px;background:radial-gradient(circle,var(--sand) .9px,transparent 1.2px) 0 50%/6px 1px repeat-x}
.dy{position:absolute;top:24px;width:0;height:0}
.dy b{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;box-sizing:border-box;border-radius:50%;background:var(--paper);border:1px solid var(--sand)}
.dy.has b{background:var(--glacier);border-color:var(--glacier)}
.dy.has.alt b{background:var(--brick);border-color:var(--brick)}
.dy span{position:absolute;top:9px;left:-21px;width:42px;text-align:center;font:400 11.5px/1 var(--f-latin);font-variant-numeric:lining-nums tabular-nums;color:var(--ink-3);transform-origin:50% 0;white-space:nowrap}
.dy.has span{color:var(--ink-2)}
.dy.m1 span{font:600 10.5px/1 var(--f-cn);color:var(--brick)}
.dy.on span{color:var(--ink);font-weight:600}
/* Clawd：可以拎起来，放到别的日子上 */
.pilot{position:absolute;left:50%;top:-4px;width:48px;height:32px;margin-left:-24px;z-index:2;touch-action:none;cursor:grab}
.pilot.lift{cursor:grabbing}
.clawd{position:absolute;left:11px;top:8px;width:26px;height:20px;overflow:visible;transform-origin:50% 80%;transition:transform .22s var(--ease)}
.shade{position:absolute;left:50%;top:26.5px;width:18px;height:3px;margin-left:-9px;border-radius:50%;background:rgba(58,47,40,.16);opacity:0;transition:transform .22s var(--ease),opacity .22s}
.clawd .lg{transform-box:fill-box;transform-origin:50% 0}
.clawd .eyes{transform-box:fill-box;transform-origin:50% 50%;transform:translateX(var(--ex,0px)) scaleY(var(--ey,1));transition:transform .12s}
.pilot.r{--ex:1px}
.pilot.l{--ex:-1px}
.pilot.blink{--ey:.15}
.pilot:not(.walk):not(.lift) .eyes{animation:idle 4.6s steps(1,end) infinite}
@keyframes idle{95%{transform:translateX(var(--ex,0px)) scaleY(.15)}}
.pilot.walk .lg.a{animation:step .24s steps(1,end) infinite}
.pilot.walk .lg.b{animation:step .24s steps(1,end) -.12s infinite}
@keyframes step{50%{transform:scaleY(.5)}}
.pilot.lift .clawd{transform:translateY(-8px) rotate(var(--tilt,0deg));transform-origin:50% 0;transition:transform .16s var(--ease)}
.pilot.lift .lg{transform:scaleY(1.5)}
.pilot.lift .shade{transform:scale(.55);opacity:.5}
.pilot.land .clawd{animation:land .34s var(--ease)}
@keyframes land{0%{transform:translateY(-8px)}55%{transform:translateY(0) scale(1.1,.86)}100%{transform:none}}

/* 读的区域：只管上下滑，不露灰色滚动条 */
.read::-webkit-scrollbar{display:none}
.read{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 20px calc(64px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);overscroll-behavior:contain}
.dayline{margin:12px 0 0;font:italic 400 12px/1.4 var(--f-latin);color:var(--ink-3);letter-spacing:.04em}
.lab{margin:12px 0 4px;font:600 9px/1 var(--f-latin);letter-spacing:.28em;color:var(--glacier)}
.index{list-style:none;margin:0;padding:0;display:grid}
.index button{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;text-align:left;background:transparent;border:0;padding:5px 0;font:400 13.5px/1.55 var(--f-cn);color:var(--ink-2);cursor:pointer;border-bottom:1px dashed var(--rule)}
.index li:last-child button{border-bottom:0}
.index button:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
.index .w{font:400 11px/1 var(--f-cn);color:var(--ink-3);white-space:nowrap}
.index .w b{font:italic 400 12px/1 var(--f-latin);color:var(--ink-2);margin:0 3px}
.index .gone{text-decoration:line-through;text-decoration-color:rgba(164,73,62,.5)}
.mem{margin:0;padding:8px 0 10px;border-bottom:1px solid var(--rule)}
.mem:last-child{border-bottom:0}
.mem .rec{margin:0;font:400 15px/1.72 var(--f-cn);color:var(--ink)}
.mem time{margin-right:8px;font:italic 400 12px/1 var(--f-latin);color:var(--gold);letter-spacing:.04em;font-variant-numeric:lining-nums tabular-nums}
.mem .now{margin-top:3px;font:400 13px/1.55 var(--f-cn);color:var(--ink-2)}
.mem .now::before{content:"当下";margin-right:8px;font:600 9px/1 var(--f-latin);letter-spacing:.2em;color:var(--glacier);vertical-align:.15em}
.mem .later{margin-top:3px;font:400 13px/1.55 var(--f-cn);color:var(--brick)}
.mem.retracted .rec span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(164,73,62,.55)}
.mem .foot{margin-top:4px;display:flex;justify-content:space-between;align-items:center;font:400 11.5px/1 var(--f-cn);color:var(--ink-3);min-height:20px}
.mem .wt b{font:italic 400 12px/1 var(--f-latin);color:var(--ink-2);margin:0 3px}
.mem .fix{border:0;background:transparent;padding:4px 0;font:400 11.5px/1 var(--f-cn);color:var(--ink-3);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.mem.flash{animation:flash 1.8s var(--ease)}
@keyframes flash{0%{background:rgba(93,132,162,.14)}100%{background:transparent}}
.empty{margin:22px 0;text-align:center;font:400 13px/2 var(--f-cn);color:var(--ink-3)}
.empty button{border:0;background:transparent;padding:2px 3px;font:italic 400 13px/1 var(--f-latin);color:var(--gold);cursor:pointer}
/* 底部：一串声波压在最下面，上面一层渐隐；内页只露一截时也贴着屏幕底 */
.fade{position:absolute;left:0;right:0;bottom:var(--peek,0px);z-index:2;height:calc(76px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(to top,var(--paper) 0 calc(30px + env(safe-area-inset-bottom,0px)),rgba(251,248,242,0));transition:bottom .42s var(--ease)}
.sheet.full .fade{bottom:0}
.sheet.drag .fade{transition:none}
.fade svg{position:absolute;left:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:100%;height:30px;overflow:visible;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="scene" id="scene">
  <img class="bg" id="bg" alt="" src="assets/近景/close-cassette.webp">
  <div class="ov tapelabel" id="tapelabel"><span class="side">SIDE A</span><span class="yr" id="lblYr">2026</span><span class="mo" id="lblMo">四月</span></div>
  <div class="ov lcd" id="lcd">now playing<b id="lcdDay">04 · 19</b></div>
</div>
<button class="back" type="button" aria-label="回到桌前">
  <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A88440"/><stop offset="1" stop-color="#6A4C1D"/></linearGradient></defs>
  <path fill="url(#gd)" d="M16.2 2.6Q11.4 7.4 5.6 12Q11.4 16.6 16.2 21.4Q12.6 16.4 9.6 12Q12.6 7.6 16.2 2.6Z"/></svg>
</button>
<span class="sample">sample data</span>

<section class="sheet" id="sheet" aria-label="这一天的记忆">
  <button class="grab" id="grab" type="button" aria-label="拉开或收起内页"></button>
  <div class="stripes" aria-hidden="true"></div>
  <header class="sh" id="sh">
    <div><span class="eb">SIDE A · MEMORIES</span>
      <button class="when" id="when" type="button" aria-expanded="false" aria-haspopup="true"><span id="hMo">四月</span><i id="hYr">2026</i><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.2 5 6.8l3.5-3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="ffbtn" id="ffbtn" type="button" aria-expanded="false" aria-controls="ffwrap"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3.5v9l5.5-4.5zM8.5 3.5v9L14 8z"/></svg>快进</button>
  </header>
  <div class="ffwrap" id="ffwrap"><div>
    <form class="ff" id="ff" role="search">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3.5v9l5.5-4.5zM8.5 3.5v9L14 8z"/></svg>
      <input id="q" type="text" enterkeyhint="search" aria-label="快进到一句话" placeholder="写一句话，比如：舟山" autocomplete="off" tabindex="-1">
      <span class="ffmsg" id="ffmsg"></span>
    </form>
  </div></div>
  <div class="axis" id="axis" role="slider" tabindex="0" aria-label="左右拖动选一天，也可以拎起 Clawd 放到某一天上">
    <div class="lane"><div class="track" id="track"></div></div>
    <div class="pilot" id="pilot">
      <i class="shade"></i>
      <svg class="clawd" viewBox="0 0 13 10" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="1" y="1" width="11" height="5" fill="#D9805F"/>
        <g class="arms" fill="#D9805F"><rect x="0" y="3" width="1" height="2"/><rect x="12" y="3" width="1" height="2"/></g>
        <g class="eyes" fill="#2A2320"><rect x="3" y="2" width="1" height="2"/><rect x="9" y="2" width="1" height="2"/></g>
        <g fill="#D9805F"><rect class="lg a" x="2" y="6" width="1" height="2"/><rect class="lg b" x="4" y="6" width="1" height="2"/><rect class="lg a" x="8" y="6" width="1" height="2"/><rect class="lg b" x="10" y="6" width="1" height="2"/></g>
      </svg>
    </div>
  </div>
  <div class="read" id="read"></div>
  <div class="fade" aria-hidden="true"><svg id="wave" preserveAspectRatio="none"></svg></div>
</section>
<div class="scrim" id="scrim"></div>
<div class="picker" id="picker" role="dialog" aria-label="选年月">
  <div class="wheel yr" id="wYr" tabindex="0" aria-label="年"><div class="rail"></div></div>
  <div class="wheel mo" id="wMo" tabindex="0" aria-label="月"><div class="rail"></div></div>
</div>

<script src="hut.js"></script>
<script>
(() => {
const IW = 1440, IH = 2560, $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');

/* ---------- 示例数据：Latent 一天一个窗口，一天里的几条按写下的时刻排 ---------- */
const MO = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
/* 记忆正文是别人能写进去的字：一律 esc 了再放（正文里混一段 <img onerror> 也只显示成字） */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
let REAL = false;
const DAY = {
 '2026-04-19':{idx:[
   ['给阳台那盆栀子换了大盆',2,0,0],
   ['大提琴课：运弓太紧，想象手里握着一个生鸡蛋',3,0,1],
   ['五一去舟山定了三天，中间留一天防起雾',1,0,2],
   ['腰封改了三版，交上去的是她选的那版',1,0,3]],
  mem:[

  const loop = now => { raf = requestAnimationFrame(loop); if (now - last < 32 || !wv.n) return; last = now; paintWave(now); };
  const run = () => { cancelAnimationFrame(raf); if (!RM && !document.hidden) raf = requestAnimationFrame(loop); };
  document.addEventListener('visibilitychange', run); run();
})();

/* ---------- 这一天：索引在上，正文在下 ---------- */
function renderDay(i){
  i = clamp(i, 0, days.length - 1); shownI = i;
  const x = days[i], day = DAY[x.k];
  axis.setAttribute('aria-valuetext', `${x.m} 月 ${x.d} 日`); drawWave(x);
  const head = `<p class="dayline">${x.m} 月 ${x.d} 日 · ${WD[x.wd]}</p>`;
  if (!day){
    readEl.innerHTML = head + `<p class="empty">${REAL ? '这天没有记忆' : '示例只写了这几天'}<br>${SAMPLES.map(k => `<button type="button" data-go="${k}">${+k.slice(5,7)}.${k.slice(8)}</button>`).join(' · ')}</p>`;
    readEl.scrollTop = 0; return;
  }
  readEl.innerHTML = head +
    '<h3 class="lab">INDEX</h3><ol class="index">' + day.idx.map(([t,wt,gone,r]) => `<li><button type="button" data-to="${r}"><span class="${gone ? 'gone' : ''}">${esc(t)}</span><span class="w">${wt ? '想起<b>' + wt + '</b>次' : ''}</span></button></li>`).join('') + '</ol>' +
    '<h3 class="lab">MEMORY</h3>' + day.mem.map((r,j) => `
      <article class="mem${r.gone ? ' retracted' : ''}" id="mem${j}">
        <p class="rec"><time>${esc(r.at)}</time><span>${esc(r.b)}</span></p>
        ${r.gone ? `<p class="later">${esc(r.gone)}</p>` : r.now ? `<p class="now">${esc(r.now)}</p>` : ''}
        ${r.later ? `<p class="later">${esc(r.later)}</p>` : ''}
        <div class="foot"><span class="wt">${r.wt ? '想起<b>' + r.wt + '</b>次' : ''}</span><button type="button" class="fix" data-j="${j}">这段记错了</button></div>
      </article>`).join('');
  readEl.scrollTop = 0;
}
function flashMem(j){
  const el = $('#mem' + j); if (!el) return;
  openSheet(true);
  setTimeout(() => { readEl.scrollTo({top: el.offsetTop - 8, behavior: 'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }, 140);
}
const goDay = (k, done) => { const i = days.findIndex(x => x.k === k); if (i >= 0) ax.to(i, null, done); };
/* 从别的页"回到那一天"过来：小路滚到那一天 */
hut.onShow(d => { if (d.date) setTimeout(() => goDay(d.date), 350); });
readEl.addEventListener('click', e => {
  const fx = e.target.closest('.fix');
  if (fx){ const x = days[shownI], r = DAY[x.k].mem[+fx.dataset.j]; hut.go('lock', {quote:r.b, date:x.k, kind:'wrong', recordId:r.id}); return; }
  const to = e.target.closest('[data-to]'); if (to) return flashMem(to.dataset.to);
  const go = e.target.closest('[data-go]'); if (go) goDay(go.dataset.go);
});

/* ---------- 年月弹层：上下拨，中间那个最大，停下就选中 ---------- */
const RH = 26;
function wheelOf(el, fmt, pick){
  const rail = el.querySelector('.rail'); let list = [];
  const shape = p => [...rail.children].forEach((b, i) => {
    const dist = Math.abs(i - p);
    b.style.transform = `scale(${(1.2 - .3*Math.min(dist, 1.6)).toFixed(3)})`;
    b.style.opacity = Math.max(0, 1 - .55*dist).toFixed(3);
    b.classList.toggle('on', Math.round(p) === i);
  });
  const w = {value:null};
  const g = glide({pos:0, min:() => 0, max:() => Math.max(0, list.length - 1), snap:Math.round,
    render:p => { rail.style.transform = `translateY(${(-p*RH).toFixed(2)}px)`; shape(p); },
    settle:i => { const v = list[i]; if (v !== w.value){ w.value = v; pick(v); } }});
  w.fill = (items, cur) => { list = items; rail.innerHTML = items.map(v => `<button type="button" tabindex="-1">${fmt(v)}</button>`).join(''); g.stop(); w.value = cur; g.set(Math.max(0, items.indexOf(cur))); };
  let y0 = null, moved = false;
  el.addEventListener('pointerdown', e => { if (e.button > 0) return; el.setPointerCapture(e.pointerId); y0 = e.clientY; moved = false; g.grab(); });
  el.addEventListener('pointermove', e => { if (y0 === null) return; const dy = e.clientY - y0; if (Math.abs(dy) > 4) moved = true; if (moved) g.drag(-dy/RH); });
  const end = e => {
    if (y0 === null) return; y0 = null;
    if (moved) return g.release();
    const r = el.getBoundingClientRect(); g.to(clamp(Math.round(g.pos + (e.clientY - r.top - RH*1.5)/RH), 0, list.length - 1));
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  let wt = null;
  el.addEventListener('wheel', e => { e.preventDefault(); g.stop(); g.set(clamp(g.pos + e.deltaY/RH*.5, 0, list.length - 1)); clearTimeout(wt); wt = setTimeout(() => g.to(Math.round(g.pos)), 120); }, {passive:false});
  el.addEventListener('keydown', e => { const k = {ArrowUp:-1, ArrowDown:1}[e.key]; if (!k) return; e.preventDefault(); g.to(clamp(Math.round(g.pos) + k, 0, list.length - 1)); });
  return w;
}
const picker = $('#picker'), scrim = $('#scrim'), when = $('#when');
function goMonth(y, m){
  const cur = days[clamp(Math.round(ax.pos), 0, days.length - 1)]; if (cur.y === y && cur.m === m) return;
  for (let j = memIdx.length - 1; j >= 0; j--){ const x = days[memIdx[j]]; if (x.y === y && x.m === m) return ax.to(memIdx[j]); }
}
const wm = wheelOf($('#wMo'), v => MO[v - 1], v => goMonth(wy.value, v));
const wy = wheelOf($('#wYr'), v => v, v => { const ms = monthsOf(v), cur = days[focusI]; const m = ms.includes(cur.m) ? cur.m : ms.at(-1); wm.fill(ms, m); goMonth(v, m); });
function openPicker(){
  const cur = days[focusI]; wy.fill(YEARS, cur.y); wm.fill(monthsOf(cur.y), cur.m);
  /* 内页下面还露着磁带时，弹层浮在内页上沿之上，不挡标题和轴；内页拉满了就落到标题下面 */
  const r = when.getBoundingClientRect(), top = sheet.getBoundingClientRect().top, H = 88, up = top > H + 70;
  picker.classList.toggle('down', !up);
  picker.style.left = Math.max(8, r.left - 10) + 'px';
  picker.style.top = (up ? top - H - 10 : r.bottom + 8) + 'px';
  picker.classList.add('on'); scrim.classList.add('on'); when.setAttribute('aria-expanded', 'true');
}
function closePicker(){ picker.classList.remove('on'); scrim.classList.remove('on'); when.setAttribute('aria-expanded', 'false'); }
when.addEventListener('click', () => picker.classList.contains('on') ? closePicker() : openPicker());
scrim.addEventListener('click', closePicker);
addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

/* ---------- 抽屉：点把手，或在把手、标题、轴上竖着拖 ---------- */
const sheet = $('#sheet');
function openSheet(on){ sheet.classList.toggle('full', on); }
const sheetDrag = (() => { let y0 = null, t0 = 0, moved = false;
  const peek = () => parseFloat(getComputedStyle(sheet).getPropertyValue('--peek')) || 0;
  return {
    get moved(){ return moved; },
    start(y){ y0 = y; moved = false; t0 = sheet.classList.contains('full') ? 0 : peek(); sheet.classList.add('drag'); },
    move(y){ if (y0 === null) return; const dy = y - y0; if (Math.abs(dy) > 4) moved = true; sheet.style.transform = `translateY(${clamp(t0 + dy, 0, peek())}px)`; },
    end(y){ if (y0 === null) return; const dy = y - y0; sheet.classList.remove('drag'); sheet.style.transform = ''; if (moved) openSheet(t0 + dy < peek()/2); y0 = null; },
  };
})();
$('#grab').addEventListener('click', () => { if (!sheetDrag.moved) openSheet(!sheet.classList.contains('full')); });
for (const el of [$('#grab'), $('#sh')]){
  el.addEventListener('pointerdown', e => { if (e.target.closest('.ffbtn,.when')) return; el.setPointerCapture(e.pointerId); sheetDrag.start(e.clientY); });
  el.addEventListener('pointermove', e => sheetDrag.move(e.clientY));
  el.addEventListener('pointerup', e => sheetDrag.end(e.clientY)); el.addEventListener('pointercancel', e => sheetDrag.end(e.clientY));
}

/* ---------- 快进：从按钮那里展开；找到就让轴滚到那一天 ---------- */
const ffwrap = $('#ffwrap'), ffbtn = $('#ffbtn'), q = $('#q');
function toggleFF(on){
  ffwrap.classList.toggle('open', on); ffbtn.setAttribute('aria-expanded', String(on)); q.tabIndex = on ? 0 : -1;
  if (on) setTimeout(() => q.focus({preventScroll:true}), 260); else q.blur();
}
ffbtn.addEventListener('click', () => toggleFF(!ffwrap.classList.contains('open')));
$('#ff').addEventListener('submit', e => {
  e.preventDefault(); const s = q.value.trim(), msg = $('#ffmsg'); if (!s) return; q.blur();
  let hit = null;
  for (const k of [...SAMPLES].reverse()) DAY[k].mem.forEach((r,j) => { if (!hit && !r.gone && r.b.includes(s)) hit = {k, j}; });
  msg.textContent = hit ? '' : 'not found'; if (!hit) return;
  goDay(hit.k, () => flashMem(hit.j));
});

addEventListener('resize', () => { layout(); AW = axis.clientWidth; ax.set(ax.pos); if (days[shownI]) drawWave(days[shownI]); });
layout(); AW = axis.clientWidth; ax.set(ax.pos); renderDay(days.length - 1);
watchSheet($('#read'), fitSheet);
requestAnimationFrame(() => { layout(); AW = axis.clientWidth; ax.set(ax.pos); });

/* ---------- 真数据：最近五周的记忆正文（/admin/api/days）。索引行进 INDEX，正文块进 MEMORY；
   正文块没写钟点的，在这一天里按先后匀开排声波（钟点只用来摆声波的位置） ---------- */
hut.api('/days').then(r => {
  if (!r || !Object.keys(r.days).length) return;
  /* 索引层一个文件就是一块：按行拆开，一行一件事（复核那行不算） */
  const idxLines = x => x.text.split('\n').filter(l => /^- \*\*/.test(l) && !/未解决复核/.test(l))
    .map(l => [(l.match(/事件：\*\*\s*(.+?)(?:；|$)/) || [, l.replace(/[*-]/g, '')])[1].trim().slice(0, 30), x.recalls, x.status === 'gone' ? 1 : 0]);
  Object.keys(DAY).forEach(k => delete DAY[k]);
  for (const [k, rows] of Object.entries(r.days)){
    const mems = rows.filter(x => x.layer !== 'index'), idxs = rows.filter(x => x.layer === 'index');
    if (!mems.length) continue;
    const mem = mems.map((x, j, all) => {
      const tm = `${x.heading || ''} ${x.text.slice(0, 80)}`.match(/(\d{1,2})[:：](\d{2})/);
      const at = tm && +tm[1] < 24 ? `${tm[1].padStart(2, '0')}:${tm[2]}` : `${String(8 + Math.round(15*(j + .5)/all.length)).padStart(2, '0')}:00`;
      const b = x.text.replace(/^#+ .*$/gm, '').replace(/\*\*/g, '').trim().replace(/^\d{1,2}[:：]\d{2}\s*/, '');   // 钟点已经在左边了
      return {at, b, now:'', wt:x.recalls, gone:x.status === 'gone' ? '撤回了：这段不算数。' : '', id:x.recordId};
    }).sort((a, b) => (a.at < b.at ? -1 : 1));
    const lines = idxs.flatMap(idxLines);
    const idx = (lines.length ? lines : mems.map(x => [x.title, x.recalls, x.status === 'gone' ? 1 : 0])).map((v, j) => [...v, Math.min(j, mem.length - 1)]);
    DAY[k] = {idx, mem};
  }
  const ks = Object.keys(DAY).sort();
  if (!ks.length) return;
  REAL = true;
  SAMPLES.splice(0, SAMPLES.length, ...ks);
  days.length = 0; memIdx.length = 0;
  for (let t = new Date(ks[0] + 'T12:00:00'); t <= new Date(ks.at(-1) + 'T12:00:00'); t.setDate(t.getDate() + 1)){
    const y = t.getFullYear(), m = t.getMonth() + 1, d = t.getDate(), k = key(y,m,d), has = !!DAY[k];
    days.push({y, m, d, k, has, wd:t.getDay()}); if (has) memIdx.push(days.length - 1);
  }
  YEARS.splice(0, YEARS.length, ...new Set(memIdx.map(i => days[i].y)));
  buildTrack(); layout(); AW = axis.clientWidth; ax.set(days.length - 1); renderDay(days.length - 1);
});
})();
