<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山屋 · 事实簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局：摊开的事实簿铺满全屏——左页是最近五周每天写下多少，右页是今天；
   底部一页纸上拉，右边书口贴着索引签，Clawd 蹲在当前那张签上；写一句话，相关的事实一条条显影出来 */
:root{
  --paper:#FBF8F2;
  --ink:#3A2F28;
  --ink-2:#76695F;
  --ink-3:#A79A8F;
  --rule:#ECE4D8;
  --brick:#A4493E;     /* 南青冈红：生活 */
  --glacier:#5D84A2;   /* 冰川灰蓝：工作 */
  --sand:#D7C8AC;      /* 草原沙 */
  --gold:#8B6A31;      /* 暗金 */
  --gold-2:#B08A45;    /* 记忆本身 */
  --page-ink:#4a382b;  /* 印在书页上的墨 */
  /* 每一类一张卡，纸色各带一点这一类的颜色 */
  --pp-a:var(--paper);
  --pp-l:color-mix(in srgb,var(--paper) 98.2%,var(--brick));
  --pp-w:color-mix(in srgb,var(--paper) 96.5%,var(--glacier));
  --pp-m:color-mix(in srgb,var(--paper) 93.5%,var(--gold-2));
  --f-latin:"Fraunces","Georgia",serif;
  --f-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:#5b3b27;color:var(--ink);font-family:var(--f-cn);overflow:hidden;-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden}
.bg{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.ov{position:absolute;pointer-events:none}

/* ---------- 书页：印上去的字，压进纸里 ---------- */
.pg{transform-origin:0 0;color:var(--page-ink);mix-blend-mode:multiply}
.pg .cap{display:flex;align-items:baseline;justify-content:space-between;margin:0;padding-bottom:6px;border-bottom:1px solid rgba(74,56,43,.22)}
.pg .cap b{font:600 7.5px/1 var(--f-latin);letter-spacing:.3em;color:var(--brick)}
.pg .cap span{font:italic 400 9px/1 var(--f-latin);color:#8a7766}
/* 左页：最近五周，一天一个点；点越大那天写得越多，颜色是那天哪一类最多 */
.trk h4{margin:8px 0 6px;font:600 12.5px/1.2 var(--f-cn)}
.trk h4 small{margin-left:6px;font:400 9px/1 var(--f-cn);color:#8a7766}
.trk .wk,.trk .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.trk .wk span{text-align:center;font:400 8px/1 var(--f-cn);color:#9a8676;padding-bottom:4px}
.trk .grid button{position:relative;height:23px;border:0;padding:0;background:transparent;display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.trk .grid i{display:block;border-radius:50%;background:currentColor;opacity:.86;transition:transform .25s var(--ease)}
.trk .grid button:active i{transform:scale(.85)}
.trk .grid .fut i{width:3px;height:3px;background:rgba(74,56,43,.22)}
.trk .grid em{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:italic 400 7px/1 var(--f-latin);color:#8a7766;white-space:nowrap;margin-top:9.5px}
.trk .grid .today::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:1px solid var(--gold-2)}
.trk .grid button[aria-pressed=true]::before{content:"";position:absolute;left:50%;bottom:-1px;width:10px;height:1.5px;margin-left:-5px;background:var(--ink);opacity:.7}
.trk .key{display:flex;gap:9px;margin-top:6px;font:400 8px/1 var(--f-cn);color:#8a7766}
.trk .key i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:.05em}
/* 右页：今天 */
.tdy .date{display:flex;align-items:flex-end;gap:8px;margin-top:9px}
.tdy .date b{font:400 42px/.8 var(--f-latin);font-variant-numeric:lining-nums;letter-spacing:-.01em}
.tdy .date span{font:italic 400 10px/1.35 var(--f-latin);color:#8a7766}
.tdy .date span i{font:400 9.5px/1.35 var(--f-cn);font-style:normal}
.tdy .wrote{margin:11px 0 0;font:400 10.5px/1.5 var(--f-cn)}
.tdy .wrote b{font:italic 400 13px/1 var(--f-latin);color:var(--brick)}
.tdy .bar{display:flex;height:5px;margin-top:7px;border-radius:3px;overflow:hidden;gap:1.5px}
.tdy .bar i{display:block}
.tdy .legend{display:grid;gap:3px;margin-top:6px;font:400 8.5px/1.3 var(--f-cn);color:#7c6958}
.tdy .legend span{display:flex;align-items:center;gap:4px}
.tdy .legend i{width:5px;height:5px;border-radius:50%}
.tdy .legend b{margin-left:auto;font:italic 400 9px/1 var(--f-latin);color:var(--page-ink)}
.tdy .last{margin:11px 0 0;padding-top:7px;border-top:1px dotted rgba(74,56,43,.3);font:400 9.5px/1.55 var(--f-cn);color:#6d5a4a}
.tdy .last span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tdy .last small{display:block;margin-bottom:2px;font:600 7px/1 var(--f-latin);letter-spacing:.24em;color:#9a8676}

/* ---------- 返回：暗金尖角箭头，背后是看不见的点击区 ---------- */
.back{position:fixed;left:6px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;padding:0;cursor:pointer}
.back svg{width:26px;height:26px;filter:drop-shadow(0 0 2.5px rgba(255,246,228,.75)) drop-shadow(0 1px 1px rgba(30,18,8,.35));transition:transform .2s var(--ease)}
.back:active svg{transform:translateX(-2px)}
.back:focus-visible{outline:1.5px solid var(--gold-2);outline-offset:-6px;border-radius:50%}
.sample{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:6;font:italic 400 11px/1 var(--f-latin);letter-spacing:.1em;color:rgba(255,250,240,.8);text-shadow:0 1px 4px rgba(0,0,0,.35)}

/* ---------- 内页：几张毛边卡片斜着叠在一起，一类一张，各自的索引签伸出右边书口；最上面那张写着字 ---------- */
.sheet{position:fixed;left:0;right:24px;bottom:0;z-index:5;height:calc(100% - 60px - env(safe-area-inset-top,0px));transform:translateY(calc(var(--peek,52%) + var(--shift,0px)));transition:transform .42s var(--ease);will-change:transform}
.sheet.full{transform:translateY(var(--shift,0px))}
/* 内页长短跟着内容变时只动 transform、不动高度（v2.5）：动高度每一帧都要重排四张带毛边和投影的卡片，
   手机上会卡。变长先把高度给足、用 --shift 把顶边按在原处再滑上去；变短先滑下去，停稳了再把多出来那截剪掉。 */
.sheet.drag,.sheet.snap,.sheet.snap .fade{transition:none}
.card{position:absolute;left:-34px;right:0;top:0;bottom:0;transform-origin:100% 250px;transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg));transition:transform .5s var(--ease);filter:drop-shadow(0 -2px 7px rgba(40,25,15,.17)) drop-shadow(0 0 1px rgba(60,40,20,.18))}
.card .paper{position:absolute;inset:0}
.card.c-a .paper{background:var(--pp-a)}
.card.c-l .paper{background:var(--pp-l)}
.card.c-w .paper{background:var(--pp-w)}
.card.c-m .paper{background:var(--pp-m)}
.card.pull{transition:transform .2s var(--ease)}
.leaf{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;transform:rotate(-.7deg);transform-origin:100% 250px;pointer-events:none}
.leaf > *{position:relative;z-index:1;pointer-events:auto}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none;border:0;background:transparent;width:100%;padding:0}
.grab::before{content:"";width:34px;height:4px;border-radius:2px;background:var(--rule)}
.grab:focus-visible{outline:2px solid var(--glacier);outline-offset:-4px}
.stripes{flex:none;height:2px;margin:0 20px;background:linear-gradient(90deg,var(--brick) 0 50%,var(--glacier) 50% 100%);opacity:.75;border-radius:1px}
.sh{flex:none;padding:12px 20px 0;touch-action:none}
.eb{display:block;font:600 9px/1 var(--f-latin);letter-spacing:.26em;color:var(--ink-3)}
/* 写一句话：就是纸上的一行，没有框 */
.line{display:flex;align-items:center;margin-top:6px;border-bottom:1px solid rgba(176,138,69,.42);transition:border-color .25s}
.line:focus-within{border-color:var(--gold)}
.line input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0 8px;font:400 17px/1.3 var(--f-cn);color:var(--ink);outline:none;border-radius:0;-webkit-appearance:none}
.line input::placeholder{color:var(--ink-3)}
.clr{flex:none;width:34px;height:34px;margin-right:-8px;display:grid;place-items:center;border:0;background:transparent;color:var(--gold);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.clr svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.line.has .clr{opacity:1;pointer-events:auto}

/* 读的区域 */
.read{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 22px calc(70px + env(safe-area-inset-bottom,0px)) 20px;margin-top:14px;border-top:1px solid var(--rule);overscroll-behavior:contain;transform-origin:0 50%}
.read::-webkit-scrollbar{display:none}
.read.out{transition:transform .2s ease-in,opacity .2s ease-in;transform:perspective(900px) rotateY(-9deg) translateX(-12px);opacity:0}
.head{margin:12px 0 0;font:italic 400 12px/1.4 var(--f-latin);color:var(--ink-3);letter-spacing:.04em}
.head b{font-weight:400;color:var(--ink-2)}
.note-meta{margin:6px 0 0;padding:7px 10px;border-left:2px solid rgba(176,138,69,.45);font:400 12px/1.6 var(--f-cn);color:var(--ink-2);background:rgba(176,138,69,.06)}
.grp{margin:16px 0 0;padding-bottom:4px;font:italic 400 12px/1 var(--f-latin);color:var(--ink-3);letter-spacing:.04em}
.fact{padding:9px 0 8px;border-bottom:1px dashed var(--rule);cursor:pointer}
.fact:last-child{border-bottom:0}
.fact p{margin:0;font:400 15px/1.66 var(--f-cn);color:var(--ink)}
.fact .st{margin-right:8px;font:600 9px/1 var(--f-latin);letter-spacing:.2em;color:var(--glacier);vertical-align:.15em}
.fact .mt{margin-top:3px;font:400 11.5px/1.4 var(--f-cn);color:var(--ink-3)}
.fact .mt i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;vertical-align:.12em}
.fact.quiet p{color:var(--ink-2)}
.acts{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.fact.open .acts{grid-template-rows:1fr}
.acts > div{overflow:hidden;min-height:0}
.acts .row{display:flex;flex-wrap:wrap;gap:4px 18px;padding-top:8px}
.acts button{border:0;background:transparent;padding:4px 0;font:400 12.5px/1 var(--f-cn);color:var(--ink-3);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.acts button.go{color:var(--gold);text-decoration:none}
.acts .note{margin:6px 0 0;font:400 12px/1.6 var(--f-cn);color:var(--ink-3)}
.acts .note:empty{display:none}
/* 显影：从淡、虚，到清楚、发黑 */
.fact.dev{animation:dev .85s var(--ease) var(--d,0ms) both}
.fact.dev p{animation:ink 1.1s var(--ease) var(--d,0ms) both}
@keyframes dev{0%{opacity:0;filter:blur(3px);transform:translateY(3px)}55%{opacity:.8}100%{opacity:1;filter:none;transform:none}}
@keyframes ink{0%{color:var(--sand)}100%{color:var(--ink)}}
.more{display:block;margin:14px auto 0;border:0;background:transparent;padding:8px 10px;font:400 12.5px/1 var(--f-cn);color:var(--gold);cursor:pointer}
.foot-meta{margin:16px 0 0;font:400 12px/1.6 var(--f-cn);color:var(--ink-3)}
.foot-meta button{border:0;background:transparent;padding:0;font:inherit;color:var(--gold);cursor:pointer}
.empty{margin:28px 0;text-align:center;font:400 13px/1.9 var(--f-cn);color:var(--ink-3)}
.empty button{border:0;background:transparent;padding:2px 3px;font:italic 400 13px/1 var(--f-latin);color:var(--gold);cursor:pointer}

/* 底部：一条细线，上面一层渐隐；内页只露一截时也贴着屏幕底 */
.leaf > .fade{position:absolute;left:0;right:0;bottom:calc(var(--peek,0px) + var(--shift,0px));z-index:2;height:calc(66px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(to top,var(--leaf-bg,var(--paper)) 0 calc(22px + env(safe-area-inset-bottom,0px)),color-mix(in srgb,var(--leaf-bg,var(--paper)) 0%,transparent));transition:bottom .42s var(--ease),background .4s}
.sheet.full .fade{bottom:var(--shift,0px)}
.sheet.drag .fade{transition:none}
.fade::after{content:"";position:absolute;left:20px;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:1px;background:linear-gradient(90deg,transparent,var(--gold-2) 18%,var(--gold-2) 82%,transparent);opacity:.5}

/* ---------- 索引签：贴在每张卡的书口，压进纸里的一截是半透明的，伸出去的一截是实的；最上面那张的签更宽、字变白 ---------- */
.tab{--c:var(--sand);--t:#6f5d4c;position:absolute;left:100%;top:var(--ty,140px);width:25px;height:54px;margin-left:-9px;border:0;padding:0 0 0 9px;border-radius:0 8px 8px 0;cursor:pointer;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,transparent) 0 9px,color-mix(in srgb,var(--c) 70%,#fff 30%) 9px);
  box-shadow:inset -1px 0 0 color-mix(in srgb,var(--c) 70%,#000 12%),inset 0 1px 0 rgba(255,255,255,.45),1.5px 1.5px 2.5px rgba(40,22,10,.28);
  transition:background .3s var(--ease),transform .3s var(--ease),width .3s var(--ease)}
.tab::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.tab span{display:block;width:16px;margin-left:auto;text-align:center;font:600 10px/1.25 var(--f-cn);color:var(--t);opacity:.78;transition:opacity .25s}
.tab[aria-pressed=true]{width:28px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 34%,transparent) 0 9px,var(--c) 9px)}
.tab[aria-pressed=true] span{width:19px;color:#fff;opacity:1}
.tab:focus-visible{outline:2px solid var(--glacier);outline-offset:1px}
.tab.t-l{--c:var(--brick);--t:#7a3028}
.tab.t-w{--c:var(--glacier);--t:#3d5f7a}
.tab.t-m{--c:var(--gold-2);--t:#7a5a24}
.tab.t-a{--t:#6a5848}
.tab.t-a[aria-pressed=true] span{color:#5a4838}

/* ---------- Clawd：蹲在当前那张签的顶上；点签他会跳过去，也能拎着他放到别的签上 ---------- */
.pilot{position:absolute;z-index:30;left:0;top:0;width:40px;height:30px;touch-action:none;cursor:grab}
.pilot.lift{cursor:grabbing}
.clawd{position:absolute;left:7px;top:5px;width:26px;height:20px;overflow:visible;transform-origin:50% 80%;transition:transform .22s var(--ease)}
.shade{position:absolute;left:50%;top:21px;width:16px;height:3px;margin-left:-8px;border-radius:50%;background:rgba(58,47,40,.18);opacity:0;transition:transform .22s var(--ease),opacity .22s}
.clawd .lg{transform-box:fill-box;transform-origin:50% 0}
.clawd .eyes{transform-box:fill-box;transform-origin:50% 50%;transform:translateX(var(--ex,-1px)) scaleY(var(--ey,1));transition:transform .12s}
.pilot.blink{--ey:.15}
.pilot:not(.hop):not(.lift) .eyes{animation:idle 4.6s steps(1,end) infinite}
@keyframes idle{95%{transform:translateX(var(--ex,-1px)) scaleY(.15)}}
.pilot.hop .lg{transform:scaleY(.5)}
.pilot.lift .clawd{transform:translateY(-6px) rotate(var(--tilt,0deg));transform-origin:50% 0;transition:transform .16s var(--ease)}
.pilot.lift .lg{transform:scaleY(1.5)}
.pilot.lift .shade{opacity:.6;transform:scale(.7)}
.pilot.land .clawd{animation:land .34s var(--ease)}
@keyframes land{0%{transform:translateY(-4px)}55%{transform:translateY(0) scale(1.1,.86)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="scene" id="scene">
  <img class="bg" id="bg" alt="" src="assets/近景/close-diary.webp">
  <div class="ov pg trk" id="trk">
    <p class="cap"><b>FIVE WEEKS</b><span id="trkRange"></span></p>
    <h4>每天写下的事实</h4>
    <div class="wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="grid"></div>
    <div class="key"><span><i style="background:var(--brick)"></i>生活多</span><span><i style="background:var(--glacier)"></i>工作多</span><span><i style="background:var(--gold-2)"></i>记忆本身多</span></div>
  </div>
  <div class="ov pg tdy" id="tdy">
    <p class="cap"><b>TODAY</b><span id="tdyWd"></span></p>
    <div class="date"><b id="tdyD"></b><span id="tdyM"></span></div>
    <p class="wrote">今天写下 <b id="tdyN"></b> 条</p>
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
    <p class="last"><small>LATEST</small><span id="tdyLast"></span></p>
  </div>
</div>
<button class="back" type="button" aria-label="回到桌前">
  <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A88440"/><stop offset="1" stop-color="#6A4C1D"/></linearGradient></defs>
  <path fill="url(#gd)" d="M16.2 2.6Q11.4 7.4 5.6 12Q11.4 16.6 16.2 21.4Q12.6 16.4 9.6 12Q12.6 7.6 16.2 2.6Z"/></svg>
</button>
<span class="sample">sample data</span>

<section class="sheet" id="sheet" aria-label="事实簿">
  <div class="deck" id="deck" role="tablist" aria-label="分类">
    <div class="card c-a" data-t=""><div class="paper"></div><button class="tab t-a" type="button" role="tab" data-t="" aria-pressed="true"><span>全<br>部</span></button></div>
    <div class="card c-l" data-t="l"><div class="paper"></div><button class="tab t-l" type="button" role="tab" data-t="l" aria-pressed="false"><span>生<br>活</span></button></div>
    <div class="card c-w" data-t="w"><div class="paper"></div><button class="tab t-w" type="button" role="tab" data-t="w" aria-pressed="false"><span>工<br>作</span></button></div>
    <div class="card c-m" data-t="m"><div class="paper"></div><button class="tab t-m" type="button" role="tab" data-t="m" aria-pressed="false"><span>记<br>忆</span></button></div>
  </div>
  <div class="leaf" id="leaf">
  <button class="grab" id="grab" type="button" aria-label="拉开或收起内页"></button>
  <div class="stripes" aria-hidden="true"></div>
  <header class="sh" id="sh">
    <span class="eb">THE LITTLE THINGS</span>
    <label class="line" id="line"><input id="q" type="text" enterkeyhint="search" autocomplete="off" aria-label="写一句话，找相关的事实" placeholder="写一句话，相关的会浮上来"><button class="clr" id="clr" type="button" aria-label="清空"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button></label>
  </header>
  <div class="read" id="read"></div>
  <div class="fade" aria-hidden="true"></div>
  </div>
  <div class="pilot" id="pilot" aria-label="Clawd：拎起来放到一张签上">
    <i class="shade"></i>
    <svg class="clawd" viewBox="0 0 13 10" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="1" width="11" height="5" fill="#D9805F"/>
      <g fill="#D9805F"><rect x="0" y="3" width="1" height="2"/><rect x="12" y="3" width="1" height="2"/></g>
      <g class="eyes" fill="#2A2320"><rect x="3" y="2" width="1" height="2"/><rect x="9" y="2" width="1" height="2"/></g>

const WD = ['周日','周一','周二','周三','周四','周五','周六'];

/* ---------- 一句话找相关的：两个字两个字地比，整句出现加分（接后端后换成 Latent 的相似检索） ---------- */
const norm = s => s.toLowerCase().replace(/[\s，。、：；！？「」“”"'‘’（）()…—\-·,.!?:;]/g, '');
const pairs = s => { const t = norm(s), g = new Set(); for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; };
FACTS.forEach(f => { f.n = norm(f.t); f.g = pairs(f.t); });
function find(q){
  const nq = norm(q), qg = pairs(q);
  return FACTS.map(f => {
    let s = f.n.includes(nq) ? 2 : 0;
    if (qg.size){ let h = 0; qg.forEach(x => { if (f.g.has(x)) h++; }); s += h/qg.size; }
    return {f, s};
  }).filter(x => x.s >= .34).sort((a, b) => b.s - a.s || (a.f.wr < b.f.wr ? 1 : -1)).map(x => x.f);
}

/* ---------- 书页：左页最近五周，右页今天 ---------- */
function drawBook(){   /* 接上真数据后"今天"会变，要能重画 */

const bg = $('#bg'), sheet = $('#sheet'), readEl = $('#read'), qEl = $('#q'), line = $('#line'), deck = $('#deck'), leaf = $('#leaf'), pilot = $('#pilot');
let S = 1, OX = 0, OY = 0;
const place = (el, x, y, w, k) => { el.style.left = OX + x*S + 'px'; el.style.top = OY + y*S + 'px'; el.style.width = w*S/k + 'px'; el.style.transform = `scale(${k})`; };
function layout(){
  const vw = innerWidth, vh = innerHeight;
  S = Math.max(vw/IW, vh/IH);
  const dw = IW*S; OX = -(dw - vw)*0.5;
  OY = Math.min(0, 66 - 530*S);                                   /* 书往上挪：书页顶边落在返回箭头下面，顶上的空桌面让给下面的卡 */
  bg.style.width = dw + 'px'; bg.style.height = IH*S + 'px'; bg.style.left = OX + 'px'; bg.style.top = OY + 'px';
  const k = Math.max(.8, S/0.33);

/* ---------- 列表 ---------- */
let tag = '', day = '', shown = 18, openI = -1;
function row(f, j, dev, grouped){
  const when = grouped ? (f.ev && f.ev !== f.wr ? fmt(f.ev) + '的事' : '') : f.ev ? fmt(f.ev) : '写于 ' + fmt(f.wr);
  return `<article class="fact${dev ? ' dev' : ''}${f.i === openI ? ' open' : ''}${f.tag === 'm' ? ' quiet' : ''}" style="--d:${j*70}ms" data-i="${f.i}">
    <p>${f.k === 's' ? '<span class="st">当下</span>' : ''}${esc(f.t)}</p>
    <div class="mt"><i class="d-${f.tag}" style="background:${f.tag === 'l' ? 'var(--brick)' : f.tag === 'w' ? 'var(--glacier)' : 'var(--gold-2)'}"></i>${TAG[f.tag]}${when ? ' · ' + when : ''}</div>
    <div class="acts"><div><div class="row"><button type="button" class="go" data-a="src">回到那一天 →</button><button type="button" data-a="wrong">这条记错了</button>${f.k === 's' ? '<button type="button" data-a="changed">已经变了</button>' : ''}</div><p class="note"></p></div></div>
  </article>`;
}
function render(dev){
  const q = qEl.value.trim();
  line.classList.toggle('has', !!q);
  let list = q ? find(q) : [...FACTS].sort((a, b) => a.wr < b.wr ? 1 : a.wr > b.wr ? -1 : a.i - b.i);
  if (day) list = list.filter(f => f.wr === day);
  let hidden = 0;
  if (tag) list = list.filter(f => f.tag === tag);
  else if (q){ hidden = list.filter(f => f.tag === 'm').length; list = list.filter(f => f.tag !== 'm'); }
  const scope = (tag ? TAG[tag] + ' · ' : '');
  let h = '';
  if (tag === 'm') h += `<p class="note-meta">这一类讲的是记忆系统本身、测试和复盘。照记，但不会自动浮上来。</p>`;
  if (q){
    h += list.length ? `<p class="head">${scope}浮上来 <b>${list.length}</b> 条</p>` + list.slice(0, 12).map((f, j) => row(f, j, dev)).join('')
                     : `<p class="empty">没有浮上来的<br>换个说法，或者写短一点</p>`;
    if (hidden) h += `<p class="foot-meta">另有 ${hidden} 条讲记忆本身的也对得上，它们不会自动浮上来。<button type="button" data-a="showmeta">翻到"记忆"</button></p>`;
  } else if (day){
    h += `<p class="head">${scope}${fmt(day)}写下 <b>${tag ? (PER_DAY[day] || [0, 0, 0])['lwm'.indexOf(tag)] : dayN(day)}</b> 条${list.length && !REAL ? ' · 示例里放了 ' + list.length + ' 条' : ''}</p>`;
    h += list.length ? list.map((f, j) => row(f, j, dev, true)).join('') : `<p class="empty">示例里没放这一天的<br><button type="button" data-a="alldays">看最近写下的</button></p>`;
  } else {
    h += `<p class="head">${scope}最近写下的</p>`;
    let lastWr = '', j = 0;
    for (const f of list.slice(0, shown)){
      if (f.wr !== lastWr){ h += `<p class="grp">${f.wr === TODAY ? '今天 · ' : ''}${fmt(f.wr)}</p>`; lastWr = f.wr; }
      h += row(f, j++, dev, true);
    }
    if (list.length > shown) h += `<button type="button" class="more" data-a="more">再往前翻</button>`;
  }
  readEl.innerHTML = h;
}
/* 换一类：这一页先翻过去，新的一页再显影出来 */
function turnTo(fn){
  if (RM){ fn(); readEl.scrollTop = 0; render(true); return; }
  readEl.classList.add('out');
  setTimeout(() => { fn(); readEl.scrollTop = 0; render(true); readEl.classList.remove('out'); }, 200);
}
let tq = null;
qEl.addEventListener('input', () => { clearTimeout(tq); tq = setTimeout(() => { openI = -1; day = ''; markDay(); readEl.scrollTop = 0; render(true); }, 260); });
qEl.addEventListener('focus', () => openSheet(true));
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') qEl.blur(); });
$('#clr').addEventListener('click', () => { qEl.value = ''; openI = -1; render(true); qEl.focus({preventScroll:true}); });

readEl.addEventListener('click', e => {
  const a = e.target.closest('[data-a]');
  if (a && a.dataset.a === 'more'){ shown += 30; render(false); return; }
  if (a && a.dataset.a === 'showmeta'){ setTag('m'); return; }
  if (a && a.dataset.a === 'alldays'){ day = ''; markDay(); turnTo(() => {}); return; }
  const card = e.target.closest('.fact');
  if (a && card){
    const f = FACTS[+card.dataset.i];
    if (a.dataset.a === 'src' ? hut.go('cassette', {date:f.ev || f.wr}) : hut.go('lock', {quote:f.t, date:f.ev || f.wr, kind:a.dataset.a})) return;
    card.querySelector('.note').textContent = {src:`接上后端后，这里会推到磁带的 ${fmt(f.ev || f.wr)}那一天。`, wrong:'已经放进写给 TA 的信封。TA 同意了，这条才会改。', changed:'已经放进写给 TA 的信封。TA 会写一条新的，接在这条后面。'}[a.dataset.a];
    return;
  }
  if (!card) return;
  const was = card.classList.contains('open');
  readEl.querySelectorAll('.fact.open').forEach(c => { c.classList.remove('open'); c.querySelector('.note').textContent = ''; });
  openI = was ? -1 : +card.dataset.i; if (!was) card.classList.add('open');
});

/* 左页点一天：看那天写下的 */
function markDay(){ document.querySelectorAll('#grid [data-day]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day === day))); }
$('#grid').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  const k = b.dataset.day;
  turnTo(() => { day = day === k ? '' : k; qEl.value = ''; openI = -1; markDay(); });

/* ---------- 卡片、索引签和 Clawd ---------- */
const cards = [...deck.querySelectorAll('.card')], tabs = cards.map(c => c.querySelector('.tab'));
const tabIndex = t => cards.findIndex(c => c.dataset.t === t);
/* 叠放的样子：最上面那张微微左斜，底下几张各自往不同方向歪一点、往上错开，毛边露出来 */
const POSE = [{r:-.7, x:0, y:0}, {r:1.3, x:3, y:-9}, {r:-1.8, x:5, y:-16}, {r:2.4, x:7, y:-23}];
let order = [0, 1, 2, 3];
function poseCards(){
  cards.forEach((c, i) => {
    const d = order.indexOf(i), p = POSE[d];
    c.style.setProperty('--r', p.r + 'deg'); c.style.setProperty('--x', p.x + 'px'); c.style.setProperty('--y', p.y + 'px');
    c.style.zIndex = 10 - d; tabs[i].setAttribute('aria-pressed', String(d === 0));
  });
  leaf.style.setProperty('--leaf-bg', `var(--pp-${cards[order[0]].dataset.t || 'a'})`);
}
/* 毛边：上沿和右沿一小段一小段地抖，每张卡的抖法不一样。
   右沿往下的位置按百分比写：卡片高度在动画里慢慢变时，纸跟着一起长、一起缩（按像素写的话，剪的那一刻读到的是旧高度，纸会短一截、字露到纸外面） */
function deckle(w, h, seed){
  let n = seed*97 + 11; const rnd = () => (n = (n*16807) % 2147483647)/2147483647;
  const pts = ['0px 0px'];
  for (let x = 6; x < w - 4; x += 5 + rnd()*5) pts.push(`${x.toFixed(1)}px ${(rnd()*2.6).toFixed(1)}px`);
  pts.push(`${(w - 1.5).toFixed(1)}px ${(1 + rnd()*1.5).toFixed(1)}px`);
  for (let y = 8; y < h; y += 6 + rnd()*7) pts.push(`${(w - rnd()*2.4).toFixed(1)}px ${(y/h*100).toFixed(3)}%`);
  pts.push(`${w}px 100%`, `0px 100%`);
  return `polygon(${pts.join(',')})`;
}
/* Clawd 的脚踩在最上面那张签的上沿 */
let seat = {x:0, y:0}, hopCancel = null;
function seatOf(i){ const r = tabs[i].getBoundingClientRect(), s = sheet.getBoundingClientRect(); return {x:r.left - s.left + 9 + (r.width - 9)/2 - 20, y:r.top - s.top - 21}; }
function placePilot(p){ seat = p; pilot.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px)`; }
function seatClawd(anim, t = tag){
  const i = Math.max(0, tabIndex(t));
  if (!anim || RM){ placePilot(seatOf(i)); return; }
  if (hopCancel) hopCancel();
  const from = {...seat}, t0 = performance.now(), dist = Math.abs(seatOf(i).y - from.y), dur = 420 + Math.min(220, dist*1.2), lift = 18 + Math.min(16, dist*.15);
  let raf = 0; pilot.classList.add('hop'); pilot.classList.remove('land');
  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = ease(k), to = seatOf(i);          // 卡还在动，每一帧都重新看签在哪
    placePilot({x:from.x + (to.x - from.x)*e, y:from.y + (to.y - from.y)*e - lift*Math.sin(Math.PI*k)});
    if (k < 1) raf = requestAnimationFrame(step);
    else { hopCancel = null; pilot.classList.remove('hop'); pilot.classList.add('land'); setTimeout(() => { pilot.classList.remove('land'); placePilot(seatOf(i)); }, 360); }
  };
  raf = requestAnimationFrame(step); hopCancel = () => cancelAnimationFrame(raf);
}
/* 换一类：那张卡先从底下抽出来一点，再放到最上面；字那一页翻过去，新的再显影 */
function bringToFront(t){
  const i = Math.max(0, tabIndex(t));
  if (order[0] !== i){
    const c = cards[i]; c.classList.add('pull');
    c.style.setProperty('--x', (POSE[order.indexOf(i)].x + 30) + 'px'); c.style.setProperty('--y', (POSE[order.indexOf(i)].y - 8) + 'px');
    setTimeout(() => { c.classList.remove('pull'); order = [i, ...order.filter(j => j !== i)]; poseCards(); }, RM ? 0 : 190);
  }
  if (t !== tag) turnTo(() => { tag = t; openI = -1; shown = 18; });
  seatClawd(true, t);
}
function setTag(t){ bringToFront(t === tag ? '' : t); }
deck.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTag(b.dataset.t); });
/* 拎起 Clawd 上下挪，放到哪张签上就翻到哪一类；只点一下是眨眼 */
(() => { let y0 = null, x0 = 0, base = null, lifted = false;
  const nearest = y => { const d = tabs.map((_, i) => Math.abs(seatOf(i).y - y)); return d.indexOf(Math.min(...d)); };
  pilot.addEventListener('pointerdown', e => { if (e.button > 0) return; e.stopPropagation(); pilot.setPointerCapture(e.pointerId); y0 = e.clientY; x0 = e.clientX; base = {...seat}; lifted = false; if (hopCancel){ hopCancel(); hopCancel = null; pilot.classList.remove('hop'); } });
  pilot.addEventListener('pointermove', e => {
    if (y0 === null) return; const dy = e.clientY - y0;
    if (!lifted){ if (Math.hypot(dy, e.clientX - x0) < 5) return; lifted = true; pilot.classList.add('lift'); }
    const ys = tabs.map((_, i) => seatOf(i).y), y = clamp(base.y + dy, Math.min(...ys) - 10, Math.max(...ys) + 10), i = nearest(y);
    placePilot({x:seatOf(i).x, y});
    pilot.style.setProperty('--tilt', clamp(dy*.04, -8, 8).toFixed(1) + 'deg');
    tabs.forEach((b, j) => b.style.transform = j === i ? 'translateX(3px)' : '');
  });
  const drop = () => {
    if (y0 === null) return; y0 = null;
    if (!lifted){ pilot.classList.add('blink'); setTimeout(() => pilot.classList.remove('blink'), 170); return; }
    pilot.classList.remove('lift'); pilot.style.removeProperty('--tilt'); tabs.forEach(b => b.style.transform = '');
    bringToFront(cards[nearest(seat.y)].dataset.t);
  };
  pilot.addEventListener('pointerup', drop); pilot.addEventListener('pointercancel', drop);
})();

/* ---------- 抽屉：点把手，或在把手和标题上下拖 ---------- */
function openSheet(on){ sheet.classList.toggle('full', on); }
sheet.addEventListener('transitionend', e => { if (e.target === sheet) seatClawd(false); });
const sheetDrag = (() => { let y0 = null, t0 = 0, moved = false;
  const peek = () => parseFloat(getComputedStyle(sheet).getPropertyValue('--peek')) || 0;
  return {
    get moved(){ return moved; },
    start(y){ y0 = y; moved = false; t0 = sheet.classList.contains('full') ? 0 : peek(); sheet.classList.add('drag'); },
    move(y){ if (y0 === null) return; const dy = y - y0; if (Math.abs(dy) > 4) moved = true; sheet.style.transform = `translateY(${clamp(t0 + dy, 0, peek())}px)`; },
    end(y){ if (y0 === null) return; const dy = y - y0; sheet.classList.remove('drag'); sheet.style.transform = ''; if (moved) openSheet(t0 + dy < peek()/2); y0 = null; },
  };
})();
$('#grab').addEventListener('click', () => { if (!sheetDrag.moved) openSheet(!sheet.classList.contains('full')); });
for (const el of [$('#grab'), $('#sh')]){
  el.addEventListener('pointerdown', e => { if (e.target.closest('input,button')) return; el.setPointerCapture(e.pointerId); sheetDrag.start(e.clientY); });
  el.addEventListener('pointermove', e => sheetDrag.move(e.clientY));
  el.addEventListener('pointerup', e => sheetDrag.end(e.clientY)); el.addEventListener('pointercancel', e => sheetDrag.end(e.clientY));
}

/* 按内容定高；卡片的毛边跟着新高度重画，四张签至少要放得下 */
function setHeight(h){
  const tt = readEl.offsetTop + 12;
  sheet.style.height = h + 'px';
  cards.forEach((c, i) => { c.querySelector('.tab').style.setProperty('--ty', tt + i*66 + 'px'); c.querySelector('.paper').style.clipPath = deckle(c.offsetWidth, h, i); });
}
function snap(f){ sheet.classList.add('snap'); f(); void sheet.offsetWidth; sheet.classList.remove('snap'); }
function fitSheet(){
  const vh = innerHeight, wantTop = Math.max(OY + 1390*S, vh*0.36), leaf = $('#leaf');
  const tt = readEl.offsetTop + 12, minH = tt + 4*66 + 36;
  const sh = Math.min(Math.max(natHeight(leaf, readEl), minH), vh - 60);
  const peek = Math.max(0, Math.min(sh - 220, wantTop - (vh - sh)));
  const was = fitSheet.h; fitSheet.h = sh;
  /* 刚打开、拖着、没开动画、长短没变：直接放 */
  if (!fitSheet.done || RM || !sheet.classList.contains('ready') || sheet.classList.contains('drag') || Math.abs(was - sh) <= .5){
    if (!fitSheet.done || Math.abs(sheet.offsetHeight - sh) > .5) setHeight(sh);
    fitSheet.done = true;
    sheet.style.setProperty('--peek', peek + 'px');
    if (Math.abs(was - sh) > .5) sheet.style.setProperty('--shift', '0px');
    return;
  }
  /* 顶边先按在现在看到的位置，再滑到新位置：只有 transform 在动 */
  const top0 = sheet.getBoundingClientRect().top, hSet = Math.max(sh, sheet.offsetHeight);
  const base = sheet.classList.contains('full') ? 0 : peek;
  snap(() => {
    if (Math.abs(sheet.offsetHeight - hSet) > .5) setHeight(hSet);
    sheet.style.setProperty('--peek', peek + 'px');
    sheet.style.setProperty('--shift', top0 - (vh - hSet) - base + 'px');
  });
  sheet.style.setProperty('--shift', hSet - sh + 'px');
}
/* 变短的那次：滑停了再把底下多出来的那截剪掉，顶边不动 */
sheet.addEventListener('transitionend', e => {
  if (e.target !== sheet || e.propertyName !== 'transform' || !fitSheet.h || sheet.offsetHeight - fitSheet.h <= .5) return;
  snap(() => { setHeight(fitSheet.h); sheet.style.setProperty('--shift', '0px'); });
});

/* ---------- 内页按内容定高：内容少就矮，拉上来不留一大截空白（跟拍立得同一套） ---------- */
function natHeight(box, read){
  let h = 0;
  for (const el of box.children){
    const cs = getComputedStyle(el);
    if (cs.position === 'absolute' || cs.position === 'fixed' || cs.display === 'none') continue;
    if (el === read){ const rs = getComputedStyle(read); h += [...read.children].reduce((n, c) => n + c.offsetHeight, 0) + parseFloat(rs.paddingTop) + parseFloat(rs.paddingBottom) + parseFloat(rs.borderTopWidth) + 1; }
    else h += el.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
  }
  return h;
}
function watchSheet(read, fit){
  let q = 0; const go = () => { if (!q) q = requestAnimationFrame(() => { q = 0; fit(); }); };
  const ro = new ResizeObserver(go);
  const obs = () => { ro.disconnect(); [...read.children].forEach(c => ro.observe(c)); go(); };
  new MutationObserver(obs).observe(read, {childList:true}); obs();
}

addEventListener('resize', layout);
layout(); render(true);

/* ---------- 真数据：最近五周的事实和每天三类各几条（/admin/api/facts、/facts/stats）。
   "今天"按库里最近一条事实算；找相关的照旧在页面里两个字两个字地比 ---------- */
hut.api('/facts/stats').then(async st => {
  if (!st || !st.latest) return;
  const d = new Date(st.latest + 'T12:00:00'); d.setDate(d.getDate() - 34);
  const from = d.toISOString().slice(0, 10), to = st.latest;
  const [s2, fx] = await Promise.all([hut.api(`/facts/stats?from=${from}&to=${to}`), hut.api(`/facts?from=${from}&to=${to}`)]);
  if (!s2 || !fx || !fx.items.length) return;
  const T = {life:'l', work:'w', meta:'m'};
  TODAY = to; REAL = true;
  Object.assign(TOTAL, {l:s2.total.life || 0, w:s2.total.work || 0, m:s2.total.meta || 0});
  Object.keys(PER_DAY).forEach(k => delete PER_DAY[k]);
  Object.entries(s2.perDay).forEach(([k, c]) => { PER_DAY[k] = [c.life || 0, c.work || 0, c.meta || 0]; });
  const rows = fx.items.filter(f => T[f.tag]).sort((a, b) => (a.date < b.date ? 1 : -1));
  FACTS.splice(0, FACTS.length, ...rows.map((f, i) => ({i, t:f.fact, tag:T[f.tag], k:f.kind === 'state' ? 's' : 'e', ev:f.date, wr:f.date})));
  FACTS.forEach(f => { f.n = norm(f.t); f.g = pairs(f.t); });
  drawBook(); layout(); render(true);
});
watchSheet(readEl, fitSheet);
requestAnimationFrame(layout);
})();
